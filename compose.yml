services:

  basedns:
    container_name: basedns
    build:
      context: .
      dockerfile: Dockerfile
    image: basedns
    ports:
      - 8053:80
      - 5053:53/udp
      - 5053:53/tcp
    environment:
      - TZ=Europe/Madrid
      - ROOT_DOMAIN=example.com.
      - WEBSITE_URL=http://localhost:8053
      - TESTING_MODE=true
      # - REMOVE_USER_DOMAIN=true
    volumes:
      - .:/code
      - basedns-bind:/etc/bind
      - basedns-bind-backups:/etc/bind-backups

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    image: basedns
    volumes:
      - .:/code
    working_dir: /code
    environment:
      - TZ=UTC
      - ROOT_DOMAIN=example.com.
      - TESTING_MODE=true
    command: >
      bash -c "fastapi run app/main.py --proxy-headers --port 80 &
      SERVER_PID=$$!;
      trap 'kill $$SERVER_PID 2>/dev/null || true' EXIT;
      until python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/')\" 2>/dev/null; do
        sleep 0.5;
      done;
      python -m unittest discover tests -v"

  js-tests:
    profiles: ["test"]
    image: node:22-alpine
    volumes:
      - .:/code
    working_dir: /code
    command: node --test tests/js/*.test.js

volumes:
  basedns-bind:
  basedns-bind-backups:
