
services:

  dns-platform:
    container_name: dns-platform
    build:
      context: .
      dockerfile: Dockerfile
    image: dns-platform
    ports:
      - 8053:80
      - 5053:53/udp
      - 5053:53/tcp
    environment:
      - TZ=Europe/Madrid
      - ROOT_DOMAIN=example.com.
      - WEBSITE_URL=http://localhost:8053
      - TESTING_MODE=true
    volumes:
      - .:/code
      - dns-platform-bind:/etc/bind
      - dns-platform-bind-backups:/etc/bind-backups

volumes:
  dns-platform-bind:
  dns-platform-bind-backups:
